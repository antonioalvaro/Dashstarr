name: Build apps
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Dashstarr-macOS
          path: dist/*.zip
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - run: npm ci
      - run: npm run helper:linux
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Dashstarr-Linux-deb
          path: dist/*.deb
  release:
    needs: [build-linux, build-mac]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Dashstarr-Linux-deb
          path: release-assets
      - uses: actions/download-artifact@v4
        if: needs.build-mac.result == 'success'
        with:
          name: Dashstarr-macOS
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          ## What's New

          - **Full Tabler Icons Catalog**: All 5,509 official Tabler outline icons are now available in the tile editor with instant multi-term search and infinite-scroll pagination.
          - **Smarter Window Close Behavior**: Closing the main window while viewing an active connection closes only that connection (returning to the next open connection or Home) instead of closing the whole window. Closing while on Home closes the window as usual (or use `Cmd/Ctrl+Shift+W` to close the window directly).
          - **Right-Click to Close Connections**: Right-click any connected Home tile or open tab to close its connection directly (plus *Close Other Connections* and *Reload* on tabs).
          - **Drag-to-Reorder Homepage Tiles**: Drag and drop server tiles on the Home screen to organize them in any order (saved automatically).
          - **Linux / ChromeOS / FydeOS `.deb` Support (`amd64` + `arm64`)**: Native Debian packages with bundled architecture-specific Tailscale helpers, desktop entry, and app icon.

          ## Install on Linux / ChromeOS / FydeOS

          - **ChromeOS / FydeOS**: Download the `.deb` for your CPU (`amd64` for x86_64 or `arm64` for ARM64), right-click it in the Files app, and choose **Install with Linux**.
          - **Debian / Ubuntu**:
            ```bash
            sudo apt install ./dashstarr_*_amd64.deb   # or _arm64.deb
            ```
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Dashstarr $TAG" \
              --notes "$NOTES"
          fi
