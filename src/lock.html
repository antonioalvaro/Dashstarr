<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>Dashstarr</title>
  <style>
    :root { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --border: rgba(0,0,0,.12); --input: #fff; --accent: #0a84ff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1e20; --text: #f5f5f7; --muted: #a1a1a6; --border: rgba(255,255,255,.12); --input: #2a2a2d; } }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 13px -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; user-select: none; }
    form { width: 280px; text-align: center; }
    img { width: 88px; height: 88px; margin-bottom: 8px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    input { display: block; width: 100%; margin-bottom: 9px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--text); font: inherit; outline: none; user-select: text; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,.25); }
    .shake { animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
    button { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; font-weight: 500; }
    button.ghost { margin-top: 8px; background: transparent; color: var(--accent); }
    button:disabled { opacity: .5; }
    .error { color: #ff453a; font-size: 12px; min-height: 16px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <form id="f" autocomplete="off">
    <img src="assets/icon.png" alt="">
    <h1>Dashstarr is locked</h1>
    <p class="sub" id="sub">Enter your password to continue.</p>
    <div id="fields">
      <input id="user" type="text" placeholder="Username" spellcheck="false" hidden>
      <input id="pass" type="password" placeholder="Password">
    </div>
    <button type="submit" id="go">Unlock</button>
    <button type="button" id="touch" class="ghost" hidden>Use Touch ID</button>
    <p class="error" id="err"></p>
  </form>
  <script src="lock.js"></script>
</body>
</html>
