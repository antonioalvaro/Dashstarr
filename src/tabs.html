<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Dashstarr</title>
  <style>
    :root { --bar: #e8e8ea; --tab: transparent; --tab-active: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --hover: rgba(0,0,0,.06); --border: rgba(0,0,0,.12); --accent: #0a84ff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bar: #1a1a1c; --tab-active: #2c2c2f; --text: #f5f5f7; --muted: #a1a1a6; --hover: rgba(255,255,255,.07); --border: rgba(255,255,255,.1); } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bar); color: var(--text); font: 12px -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-user-select: none; overflow: hidden; }
    .bar { height: 38px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border); }
    .home { width: 30px; height: 28px; flex: none; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .home:hover { background: var(--hover); color: var(--text); }
    .home.on { color: var(--accent); background: var(--hover); }
    .home svg { width: 17px; height: 17px; }
    .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; }
    .tab { flex: 0 1 210px; min-width: 70px; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 9px; border-radius: 7px; background: var(--tab); }
    .tab:hover { background: var(--hover); }
    .tab.active { background: var(--tab-active); box-shadow: 0 0 0 1px var(--border); }
    .chip { width: 18px; height: 18px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
    .chip svg { width: 12px; height: 12px; }
    .spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); border-top-color: transparent; animation: s .8s linear infinite; flex: none; }
    @keyframes s { to { transform: rotate(360deg); } }
    .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .x { width: 18px; height: 18px; flex: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; line-height: 1; opacity: 0; }
    .tab:hover .x, .tab.active .x { opacity: 1; }
    .x:hover { background: var(--hover); color: var(--text); }
  </style>
</head>
<body>
  <div class="bar">
    <div class="home" id="home" title="Home (Cmd+0)">
      <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.05 20.1L10 14l-7-3.5a.55.55 0 0 1 0-1L21 3l-3.312 9.173M19 16l-2 3h4l-2 3"/></svg>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <script src="icons.js"></script>
  <script src="tabs.js"></script>
</body>
</html>
