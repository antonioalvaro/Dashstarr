<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Dashstarr</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="topbar">
    <form id="quick" class="quick" autocomplete="off">
      <div class="addr-group">
        <select id="quickProtocol" class="proto-select" aria-label="Protocol">
          <option value="http://">http://</option>
          <option value="https://">https://</option>
        </select>
        <input id="address" type="text" spellcheck="false" placeholder="Enter an IP address, e.g. 192.168.1.50:8080" autofocus>
      </div>
      <button type="submit" class="primary">Connect</button>
      <button type="button" id="tsPill" class="ts-pill" hidden><span class="ts-dot"></span><span id="tsLabel">Tailscale</span></button>
    </form>
  </header>

  <main>
    <div class="section-head">
      <h2>Your Servers</h2>
      <span class="hint">Double click to connect, right click for options</span>
    </div>
    <div id="grid" class="grid"></div>

    <section id="tsSection" class="ts-section" hidden>
      <div class="section-head">
        <h2>Tailscale Devices</h2>
        <span class="hint" id="tsHint"></span>
      </div>
      <div id="tsBanner" class="ts-banner" hidden>
        <span id="tsBannerText"></span>
        <button type="button" id="tsBannerBtn" class="primary"></button>
      </div>
      <div id="tsDevices" class="devices"></div>
    </section>
  </main>

  <dialog id="editor">
    <form id="editForm" method="dialog" autocomplete="off">
      <h3 id="editTitle">Add Server</h3>
      <label>Name<input id="editName" type="text" placeholder="My Desktop" spellcheck="false"></label>
      <div class="field">
        <label for="editAddress">Address</label>
        <div class="addr-group dialog-addr">
          <select id="editProtocol" class="proto-select" aria-label="Protocol">
            <option value="http://">http://</option>
            <option value="https://">https://</option>
          </select>
          <input id="editAddress" type="text" placeholder="192.168.1.50:8080" spellcheck="false" required>
        </div>
      </div>
      <p class="small">Choose http:// or https:// and enter an IP or hostname with port.</p>
      <div class="appearance-preview">
        <div id="editPreviewThumb" class="preview-thumb"></div>
        <div class="preview-meta">
          <div class="preview-title">Tile appearance</div>
          <div id="editPreviewLabel" class="preview-sub">Desktop</div>
        </div>
      </div>
      <div class="field">
        <label>Color</label>
        <div id="editColors" class="color-row">
          <button type="button" class="swatch auto" data-color="" title="Automatic color">Auto</button>
          <label class="color-custom" title="Custom color">
            <input id="editCustomColor" type="color" aria-label="Custom color">
            <span aria-hidden="true"></span>
          </label>
        </div>
      </div>
      <div class="field">
        <div class="icon-head">
          <label for="editIconSearch">Icon</label>
          <input id="editIconSearch" type="search" placeholder="Search Tabler icons…" spellcheck="false">
        </div>
        <div id="editIconGrid" class="icon-grid" role="listbox" aria-label="Service icon"></div>
      </div>
      <p id="editError" class="error"></p>
      <div class="buttons">
        <button type="button" id="editCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="icons.js"></script>
  <script src="home.js"></script>
</body>
</html>
